<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>晚休住校须知</title>
<style>
/* ========== FONT ========== */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400&display=swap');

/* ========== CUSTOM PROPERTIES ========== */
:root {
  --bg-deep:        #0d0d0d;
  --bg-surface:     #141414;
  --text-primary:   #c8c8c8;
  --text-secondary: #7a7a7a;
  --text-dim:       #3a3a3a;
  --accent-blood:   #8b1a1a;
  --accent-glow:    #a52a2a;
  --font-primary:   "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-ui:        "Helvetica Neue", "PingFang SC", sans-serif;
  --fs-body:        16px;
  --fs-title:       26px;
  --fs-rule:        17px;
  --fs-small:       13px;
  --ls-wide:        0.18em;
  --ls-rule:        0.22em;
  --lh-body:        2.2;
  --lh-rule:        2.5;
  --max-text-width: 600px;
  --pad-section:    3rem;
  --pad-text:       2rem;
  --dur-eye-open:   3.0s;
  --dur-type-char:  55ms;
  --dur-shake:      0.45s;
  --dur-fade:       1.0s;
  --dur-breath:     5.0s;
}

/* ========== SCROLLBAR HIDE ========== */
html { -ms-overflow-style: none; scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

/* ========== RESET ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-primary);
  font-size: var(--fs-body);
  font-weight: 300;
  letter-spacing: var(--ls-wide);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x pan-y; /* allow vertical scroll only, block pinch-zoom */
}

/* ========== FIXED OVERLAYS ========== */
#noise-canvas {
  position: fixed; inset: 0; z-index: 1;
  pointer-events: none;
  mix-blend-mode: overlay;
  opacity: 0.10;
}
#vignette-overlay {
  position: fixed; inset: 0; z-index: 2;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.50) 78%, rgba(0,0,0,0.80) 100%);
}

/* ========== MAIN CONTAINER ========== */
#game-root {
  position: relative; z-index: 10;
  width: 100%; max-width: var(--max-text-width);
  margin: 0 auto;
  padding: var(--pad-section) var(--pad-text);
  min-height: 100vh;
  display: flex; flex-direction: column; justify-content: center;
  transition: opacity var(--dur-fade) ease;
}

/* ========== PHASE LAYERS ========== */
.phase-layer {
  transition: opacity 0.8s ease;
  opacity: 1;
}
.phase-layer.hidden {
  display: none;
}

/* ========== INTRO: EYE OPEN ========== */
#intro-eyelid {
  position: fixed; inset: 0; z-index: 100;
  background: #000;
  clip-path: ellipse(0% 0.5% at 50% 50%);
  animation: eyeOpen var(--dur-eye-open) cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  pointer-events: none;
}
@keyframes eyeOpen {
  0%   { clip-path: ellipse(0% 0.3% at 50% 50%); }
  12%  { clip-path: ellipse(0% 0.3% at 50% 50%); }
  28%  { clip-path: ellipse(6% 1.0% at 50% 50%); }
  48%  { clip-path: ellipse(35% 7% at 50% 50%); }
  68%  { clip-path: ellipse(65% 25% at 50% 50%); }
  85%  { clip-path: ellipse(90% 55% at 50% 50%); }
  100% { clip-path: ellipse(180vmax 180vmax at 50% 50%); }
}

/* ========== TITLE ========== */
#game-title {
  font-size: var(--fs-title);
  font-weight: 200;
  letter-spacing: 0.35em;
  text-align: center;
  color: var(--text-primary);
  margin-bottom: 3rem;
  opacity: 0;
  transition: opacity 1.5s ease;
}
#game-title.visible { opacity: 1; }

/* ========== TYPING TEXT ========== */
.typing-text {
  position: relative;
  min-height: 1.5em;
  white-space: pre-wrap;
}
.typing-active::after {
  content: '';
  display: inline-block;
  width: 1px; height: 1.1em;
  background: var(--text-primary);
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: cursorBlink 0.8s step-end infinite;
}
@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0; }
}

/* ========== RULES ========== */
.rule-title {
  font-size: var(--fs-small);
  font-weight: 300;
  letter-spacing: 0.28em;
  color: var(--text-secondary);
  margin-bottom: 1.5rem;
  text-transform: uppercase;
}
.rule-body {
  font-size: var(--fs-rule);
  letter-spacing: var(--ls-rule);
  line-height: var(--lh-rule);
  font-weight: 300;
}

/* ========== EVENTS ========== */
.event-time {
  font-size: var(--fs-small);
  font-weight: 300;
  letter-spacing: 0.25em;
  color: var(--text-secondary);
  margin-bottom: 2rem;
}
.event-body {
  font-size: var(--fs-rule);
  letter-spacing: var(--ls-rule);
  line-height: var(--lh-rule);
  font-weight: 300;
  margin-bottom: 2.5rem;
}
.event-outcome {
  font-size: var(--fs-rule);
  letter-spacing: var(--ls-rule);
  line-height: var(--lh-rule);
  font-weight: 300;
  color: var(--text-secondary);
  margin-top: 2rem;
}

/* ========== CHOICE BUTTONS ========== */
.choices-row {
  display: flex; gap: 1.5rem;
  margin-top: 2rem;
}
.choice-btn {
  flex: 1;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--text-dim);
  padding: 0.9rem 1.5rem;
  font-family: var(--font-ui);
  font-size: var(--fs-small);
  font-weight: 300;
  letter-spacing: 0.12em;
  cursor: pointer;
  transition: border-color 0.4s ease, color 0.4s ease, background 0.4s ease;
  position: relative;
}
.choice-btn:hover {
  border-color: var(--text-primary);
  color: var(--text-primary);
  background: rgba(139, 26, 26, 0.06);
}
.choice-btn:active {
  transform: scale(0.97);
  transition: transform 0.05s ease;
}

/* ========== ENDING ========== */
.ending-title {
  font-size: var(--fs-title);
  font-weight: 200;
  letter-spacing: 0.32em;
  text-align: center;
  margin-bottom: 0.8rem;
}
.ending-subtitle {
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.40em;
  color: var(--text-dim);
  text-align: center;
  margin-bottom: 2.5rem;
}
.ending-body {
  font-size: var(--fs-rule);
  letter-spacing: var(--ls-rule);
  line-height: var(--lh-rule);
  font-weight: 300;
  color: var(--text-secondary);
  white-space: pre-wrap;
  margin-bottom: 3rem;
}
.ending-actions {
  display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center;
}
.action-btn {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid #1f1f1f;
  padding: 0.7rem 1.6rem;
  font-family: var(--font-ui);
  font-size: var(--fs-small);
  font-weight: 300;
  letter-spacing: 0.14em;
  cursor: pointer;
  transition: border-color 0.4s, color 0.4s, background 0.4s;
}
.action-btn:hover {
  border-color: var(--text-secondary);
  color: var(--text-primary);
  background: rgba(139, 26, 26, 0.05);
}

/* ========== CONTINUE HINT ========== */
.continue-hint {
  text-align: center;
  margin-top: 3rem;
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--text-dim);
  animation: hintPulse 2.5s ease-in-out infinite;
  cursor: pointer;
}
@keyframes hintPulse {
  0%, 100% { opacity: 0.25; }
  50%      { opacity: 0.55; }
}

/* ========== BREATHING GLOW ========== */
.breath-glow {
  position: fixed; top: 50%; left: 50%;
  width: 320px; height: 320px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(165,42,42,0.06) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
  animation: breath var(--dur-breath) ease-in-out infinite;
}
@keyframes breath {
  0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
  50%      { opacity: 1.0; transform: translate(-50%, -50%) scale(1.08); }
}

/* ========== SHAKE ========== */
@keyframes shake {
  0%   { transform: translateX(0); }
  12%  { transform: translateX(-5px); }
  25%  { transform: translateX(4px); }
  37%  { transform: translateX(-3px); }
  50%  { transform: translateX(2px); }
  62%  { transform: translateX(-1px); }
  75%  { transform: translateX(0.5px); }
  100% { transform: translateX(0); }
}
.shaking {
  animation: shake var(--dur-shake) cubic-bezier(.36,.07,.19,.97) both;
}

/* ========== COLLECTION ========== */
#collection-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1.2rem;
  margin-bottom: 2rem;
}
.collection-card {
  background: var(--bg-surface);
  border: 1px solid #1f1f1f;
  padding: 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.4s, opacity 0.4s;
}
.collection-card:hover { border-color: var(--accent-blood); }
.collection-card .card-title { font-size: var(--fs-small); letter-spacing: 0.20em; margin-bottom: 0.5rem; }
.collection-card .card-subtitle { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.30em; color: var(--text-dim); margin-bottom: 1rem; }
.collection-card .card-status { font-size: 10px; letter-spacing: 0.20em; color: var(--accent-blood); }

/* ========== POSTER CANVAS ========== */
#poster-canvas {
  display: block; max-width: 100%; margin: 0 auto 2rem;
  border: 1px solid #1f1f1f;
}
.poster-actions {
  display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
}

/* ========== TOAST ========== */
#toast {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
  z-index: 200;
  background: var(--bg-surface);
  border: 1px solid var(--text-dim);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: var(--fs-small);
  letter-spacing: 0.14em;
  padding: 0.6rem 1.8rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
#toast.show { opacity: 1; }

/* ========== SKIP BUTTON ========== */
.skip-hint {
  position: fixed; bottom: 1.8rem; right: 2rem; z-index: 20;
  font-family: var(--font-ui);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--text-dim);
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.6s;
  pointer-events: none;
}
.skip-hint.show {
  opacity: 0.5;
  pointer-events: auto;
}

/* ========== FLOATING SHARE BUTTON ========== */
#float-share {
  position: fixed; bottom: 1.5rem; left: 1.5rem; z-index: 30;
  background: transparent;
  color: var(--text-dim);
  border: 1px solid #1a1a1a;
  padding: 0.45rem 1rem;
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.18em;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease, border-color 0.4s, color 0.4s;
}
#float-share.visible {
  opacity: 0.45;
  pointer-events: auto;
}
#float-share:hover {
  border-color: var(--text-secondary);
  color: var(--text-primary);
}

/* ========== RESPONSIVE ========== */
@media (max-width: 600px) {
  :root {
    --fs-body: 14px; --fs-title: 20px; --fs-rule: 15px; --fs-small: 12px;
    --pad-section: 1.8rem; --pad-text: 1rem;
    --max-text-width: 100%;
  }
  html, body {
    height: -webkit-fill-available;
    min-height: 100vh;
    min-height: -webkit-fill-available;
  }
  #game-root {
    min-height: 100vh;
    min-height: -webkit-fill-available;
    justify-content: flex-start;
    padding-top: 2.5rem;
    padding-bottom: 3rem;
  }
  .choices-row { flex-direction: column; gap: 0.8rem; }
  .choice-btn {
    width: 100%;
    padding: 1rem 1.2rem;
    font-size: 14px;
  }
  .ending-actions { flex-direction: column; align-items: center; gap: 0.8rem; }
  .action-btn { width: 100%; max-width: 260px; padding: 0.8rem 1.2rem; }
  #collection-grid { grid-template-columns: 1fr 1fr; }
  #float-share { bottom: 1rem; left: 1rem; padding: 0.4rem 0.8rem; font-size: 10px; }
  #skip-hint { bottom: 1rem; right: 1rem; }
  .continue-hint { margin-top: 2rem; }
}
/* Extra small screens (iPhone SE, etc.) */
@media (max-width: 374px) {
  :root {
    --fs-body: 13px; --fs-title: 18px; --fs-rule: 14px;
    --pad-section: 1.2rem; --pad-text: 0.8rem;
  }
  #game-root { padding-top: 1.5rem; }
  .choice-btn { padding: 0.8rem 1rem; }
}
</style>
</head>
<body oncontextmenu="return false">

<!-- FIXED OVERLAYS -->
<canvas id="noise-canvas"></canvas>
<div id="vignette-overlay"></div>
<div class="breath-glow" id="breath-glow"></div>
<div id="toast"></div>
<div class="skip-hint" id="skip-hint">[ 点击跳过 ]</div>
<button id="float-share">分享</button>

<!-- MAIN CONTAINER -->
<main id="game-root">

  <!-- PHASE: INTRO -->
  <section id="layer-intro" class="phase-layer">
    <div id="intro-eyelid"></div>
  </section>

  <!-- PHASE: RULES -->
  <section id="layer-rules" class="phase-layer hidden">
    <div id="game-title"></div>
    <div id="rules-content">
      <div class="rule-title" id="rule-title"></div>
      <div class="rule-body typing-text" id="rule-body"></div>
    </div>
    <div class="continue-hint hidden" id="rules-hint">[ 点击继续 ]</div>
  </section>

  <!-- PHASE: EVENTS -->
  <section id="layer-events" class="phase-layer hidden">
    <div class="event-time" id="event-time"></div>
    <div class="event-body typing-text" id="event-text"></div>
    <div class="event-outcome typing-text hidden" id="event-outcome"></div>
    <div class="choices-row hidden" id="event-choices">
      <button class="choice-btn" id="btn-obey"></button>
      <button class="choice-btn" id="btn-violate"></button>
    </div>
    <div class="continue-hint hidden" id="events-hint">[ 点击继续 ]</div>
  </section>

  <!-- PHASE: ENDING -->
  <section id="layer-ending" class="phase-layer hidden">
    <div class="ending-title" id="ending-title"></div>
    <div class="ending-subtitle" id="ending-subtitle"></div>
    <div class="ending-body" id="ending-body"></div>
    <div class="ending-actions">
      <button class="action-btn" id="btn-poster">生成海报</button>
      <button class="action-btn" id="btn-share">复制分享链接</button>
      <button class="action-btn" id="btn-collection">结局收藏</button>
      <button class="action-btn" id="btn-restart">重新开始</button>
    </div>
  </section>

  <!-- PHASE: POSTER -->
  <section id="layer-poster" class="phase-layer hidden">
    <canvas id="poster-canvas"></canvas>
    <div class="poster-actions">
      <button class="action-btn" id="btn-save-poster">保存图片</button>
      <button class="action-btn" id="btn-close-poster">返回</button>
    </div>
  </section>

  <!-- PHASE: COLLECTION -->
  <section id="layer-collection" class="phase-layer hidden">
    <h2 style="font-weight:200;letter-spacing:0.28em;text-align:center;margin-bottom:2rem;font-size:var(--fs-small);color:var(--text-secondary);">结局收藏</h2>
    <div id="collection-grid"></div>
    <div class="ending-actions" style="margin-top:1rem;">
      <button class="action-btn" id="btn-close-collection">返回</button>
    </div>
  </section>

</main>

<script>
// ==================== HELPER ====================
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// ==================== STORAGE ====================
const STORAGE_KEY = 'dorm_rules_save';
const Storage = {
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : { unlocked: [], lastEnding: null, plays: 0 };
    } catch { return { unlocked: [], lastEnding: null, plays: 0 }; }
  },
  save(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
  },
  unlock(endingId) {
    const d = this.load();
    if (!d.unlocked.includes(endingId)) d.unlocked.push(endingId);
    d.lastEnding = endingId;
    d.plays += 1;
    this.save(d);
  },
  getUnlocked() { return this.load().unlocked; },
};

// ==================== AUDIO (subtle ambient via Web Audio) ====================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}
function playTone(freq, type, duration, vol = 0.02) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}

// ==================== NOISE CANVAS ====================
function initNoise() {
  const canvas = $('#noise-canvas');
  const ctx = canvas.getContext('2d');
  function draw() {
    const scale = 4;
    const w = Math.floor(window.innerWidth / scale);
    const h = Math.floor(window.innerHeight / scale);
    canvas.width = w; canvas.height = h;
    canvas.style.width = '100%'; canvas.style.height = '100%';
    const img = ctx.createImageData(w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = img.data[i+1] = img.data[i+2] = v;
      img.data[i+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  draw();
  window.addEventListener('resize', draw);
}

// ==================== STATE MACHINE ====================
const State = {
  phase: 'BOOT',
  ruleIndex: 0,
  eventIndex: 0,
  eventQueue: [],
  flags: { obeyCount: 0, violateCount: 0, triggeredVisitor: false, triggered404: false, triggeredMirror: false, triggeredList: false },
  endingId: null,
  isTyping: false,
  skipRequested: false,
  currentSkipResolver: null,
};

const layerIds = ['layer-intro', 'layer-rules', 'layer-events', 'layer-ending', 'layer-poster', 'layer-collection'];

function showLayer(id) {
  layerIds.forEach(lid => {
    const el = $('#' + lid);
    if (lid === id) el.classList.remove('hidden');
    else el.classList.add('hidden');
  });
}

// ==================== TYPEWRITER ====================
async function typewrite(el, text, opts = {}) {
  const baseSpeed = opts.baseSpeed || 55;
  const punctPause = opts.punctPause || 380;
  const punctChars = new Set(['。','，','、','…','——','？','！','；','：']);

  State.isTyping = true;
  State.skipRequested = false;
  el.textContent = '';
  el.classList.add('typing-active');
  $('#skip-hint').classList.add('show');

  let displayed = '';
  const lines = text.split('\n');

  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];
    for (let i = 0; i < line.length; i++) {
      if (State.skipRequested) {
        el.textContent = text;
        State.isTyping = false;
        el.classList.remove('typing-active');
        $('#skip-hint').classList.remove('show');
        return 'skipped';
      }
      displayed += line[i];
      el.textContent = displayed;
      const ch = line[i];
      const delay = punctChars.has(ch) ? baseSpeed + punctPause : baseSpeed;
      await sleep(delay);
    }
    if (li < lines.length - 1) {
      displayed += '\n';
      el.textContent = displayed;
      await sleep(baseSpeed + 200);
    }
  }

  State.isTyping = false;
  el.classList.remove('typing-active');
  $('#skip-hint').classList.remove('show');
  return 'completed';
}

// ==================== SKIP HANDLER ====================
function setupSkip() {
  document.addEventListener('click', () => {
    if (State.isTyping) {
      State.skipRequested = true;
      $('#skip-hint').classList.remove('show');
    }
  });
}

// ==================== SHAKE ====================
function triggerShake() {
  const root = $('#game-root');
  root.classList.remove('shaking');
  void root.offsetWidth;
  root.classList.add('shaking');
  setTimeout(() => root.classList.remove('shaking'), 500);
}

// ==================== HINT PULSE ====================
function showHint(hintEl) { hintEl.classList.remove('hidden'); }
function hideHint(hintEl) { hintEl.classList.add('hidden'); }

// ==================== WAIT FOR TAP ====================
function waitForTap() {
  return new Promise(resolve => {
    const handler = () => {
      if (State.isTyping) return; // ignore clicks while typewriter still active
      document.removeEventListener('click', handler);
      resolve();
    };
    setTimeout(() => document.addEventListener('click', handler), 150);
  });
}

// ==================== TOAST ====================
function showToast(msg) {
  const toast = $('#toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Combine all events, shuffle and pick 6
function buildEventQueue() {
  const all = [...EVENTS, ...EXTRA_EVENTS];
  // Fisher-Yates shuffle
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  return all.slice(0, 6);
}

function resolveEnding() {
  const f = State.flags;
  if (f.triggeredList)    return 'list';
  if (f.triggered404)     return 'room404';
  if (f.triggeredVisitor) return 'visitor';
  if (f.violateCount >= 4) return 'curiosity';
  return 'sunrise';
}

// ==================== POSTER RENDERING ====================
function wrapText(ctx, text, maxWidth) {
  const lines = [];
  for (const paragraph of text.split('\n')) {
    if (paragraph === '') { lines.push(''); continue; }
    let line = '';
    for (const ch of paragraph) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line.length > 0) {
        lines.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
  }
  return lines;
}

function generatePoster(endingId) {
  const ending = ENDINGS[endingId];
  const canvas = $('#poster-canvas');
  const ctx = canvas.getContext('2d');
  const W = 900, H = 1200;
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = Math.min(400, window.innerWidth - 40) + 'px';
  canvas.style.height = 'auto';

  // Background
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, W, H);

  // Noise layer
  const imgData = ctx.createImageData(W, H);
  for (let i = 0; i < imgData.data.length; i += 4) {
    const v = Math.random() * 35;
    imgData.data[i] = imgData.data[i+1] = imgData.data[i+2] = v;
    imgData.data[i+3] = 255;
  }
  ctx.putImageData(imgData, 0, 0);

  // Vignette
  const grad = ctx.createRadialGradient(W/2, H/2, H*0.28, W/2, H/2, H*0.72);
  grad.addColorStop(0, 'transparent');
  grad.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Top red line
  ctx.fillStyle = '#8b1a1a';
  ctx.fillRect(W * 0.18, H * 0.09, W * 0.64, 1);

  // Title
  ctx.fillStyle = '#c8c8c8';
  ctx.font = '200 34px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(ending.title, W/2, H * 0.22);

  // Subtitle
  ctx.font = '200 13px "Helvetica Neue", "PingFang SC", sans-serif';
  ctx.fillStyle = '#5a5a5a';
  ctx.fillText(ending.subtitle, W/2, H * 0.265);

  // Divider
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(W * 0.38, H * 0.295, W * 0.24, 1);

  // Body
  ctx.font = '300 17px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#9a9a9a';
  const lines = wrapText(ctx, ending.body, W * 0.6);
  let y = H * 0.36;
  for (const line of lines) {
    ctx.fillText(line, W/2, y);
    y += 34;
  }

  // Bottom date
  ctx.font = '200 11px "Helvetica Neue", "PingFang SC", sans-serif';
  ctx.fillStyle = '#4a4a4a';
  const now = new Date().toISOString().slice(0, 10);
  ctx.fillText(`达成于 ${now}`, W/2, H * 0.88);

  // Bottom red line
  ctx.fillStyle = '#8b1a1a';
  ctx.fillRect(W * 0.18, H * 0.91, W * 0.64, 1);

  // Watermark
  ctx.font = '200 10px "Helvetica Neue", "PingFang SC", sans-serif';
  ctx.fillStyle = '#2a2a2a';
  ctx.fillText('晚休住校须知', W/2, H * 0.96);
}

  ruleBodyEl.textContent = '';

  // Display each rule
  for (let i = 0; i < RULES.length; i++) {
    State.ruleIndex = i;
    const rule = RULES[i];
    ruleTitleEl.textContent = rule.title;
    await typewrite(ruleBodyEl, rule.body, { baseSpeed: 45 });
    if (i < RULES.length - 1) {
      await waitForTap();
      ruleBodyEl.textContent = '';

  }
  await sleep(800);
  // Final hint
  ruleBodyEl.textContent = '';
  ruleTitleEl.textContent = '';
  await typewrite(ruleBodyEl, '以上守则，请务必遵守。\n现在——\n熄灯了。', { baseSpeed: 50 });
  await sleep(1000);
  await waitForTap();
}

// ==================== PHASE: EVENTS ====================
async function enterEvents() {
  showLayer('layer-events');
  const timeEl = $('#event-time');
  const textEl = $('#event-text');
  const outcomeEl = $('#event-outcome');
  const choicesRow = $('#event-choices');
  const obeyBtn = $('#btn-obey');
  const violateBtn = $('#btn-violate');
  const hintEl = $('#events-hint');

  State.eventQueue = buildEventQueue();

  for (let i = 0; i < State.eventQueue.length; i++) {
    State.eventIndex = i;
    const event = State.eventQueue[i];

    // Display event
    timeEl.textContent = event.title;
    textEl.textContent = '';
    outcomeEl.textContent = '';
    outcomeEl.classList.add('hidden');
    choicesRow.classList.add('hidden');
    hideHint(hintEl);

    await typewrite(textEl, event.text);

    // Show choices
    obeyBtn.textContent = event.obey.label;
    violateBtn.textContent = event.violate.label;
    choicesRow.classList.remove('hidden');

    // Wait for choice
    const choice = await new Promise(resolve => {
      obeyBtn.onclick = () => resolve('obey');
      violateBtn.onclick = () => resolve('violate');
    });
    obeyBtn.onclick = violateBtn.onclick = null;

    // Hide choices
    choicesRow.classList.add('hidden');

    // Outcome
    const outcome = choice === 'obey' ? event.obey : event.violate;

    // Shake on violate
    if (choice === 'violate') {
      triggerShake();
      playTone(45, 'sawtooth', 0.5, 0.03);
      await sleep(500);
    } else {
      playTone(80, 'sine', 0.6, 0.015);
    }

    // Record flags
    for (const [key, val] of Object.entries(outcome.flags)) {
      if (key === 'triggeredVisitor') State.flags.triggeredVisitor = true;
      else if (key === 'triggered404') State.flags.triggered404 = true;
      else if (key === 'triggeredMirror') State.flags.triggeredMirror = true;
      else if (key === 'triggeredList') State.flags.triggeredList = true;
      else if (key === 'obeyCount') State.flags.obeyCount += val;
      else if (key === 'violateCount') State.flags.violateCount += val;
    }

    // Display outcome
    outcomeEl.classList.remove('hidden');
    await typewrite(outcomeEl, outcome.text);

    if (i < State.eventQueue.length - 1) {
      showHint(hintEl);
      await waitForTap();
      hideHint(hintEl);
    }
  }

  await sleep(600);
}

// ==================== PHASE: ENDING ====================
async function enterEnding() {
  showLayer('layer-ending');
  State.endingId = resolveEnding();
  Storage.unlock(State.endingId);

  const ending = ENDINGS[State.endingId];
  $('#ending-title').textContent = ending.title;
  $('#ending-subtitle').textContent = ending.subtitle;

  const bodyEl = $('#ending-body');
  bodyEl.textContent = '';
  await typewrite(bodyEl, ending.body, { baseSpeed: 45 });

  await sleep(500);
}

// ==================== PHASE: POSTER ====================
function enterPoster() {
  showLayer('layer-poster');
  generatePoster(State.endingId);
}

// ==================== PHASE: COLLECTION ====================
function enterCollection() {
  showLayer('layer-collection');
  const grid = $('#collection-grid');
  grid.innerHTML = '';
  const unlocked = Storage.getUnlocked();

  for (const [key, ending] of Object.entries(ENDINGS)) {
    const card = document.createElement('div');
    card.className = 'collection-card';
    const isUnlocked = unlocked.includes(key);

    if (isUnlocked) {
      card.innerHTML = `
        <div class="card-title">${ending.title}</div>
        <div class="card-subtitle">${ending.subtitle}</div>
        <div class="card-status">已解锁</div>
      `;
      card.addEventListener('click', () => {
        State.endingId = key;
        enterPoster();
      });
    } else {
      card.style.opacity = '0.35';
      card.style.cursor = 'default';
      card.innerHTML = `
        <div class="card-title" style="color:var(--text-dim)">？？？</div>
        <div class="card-subtitle">尚未发现</div>
        <div class="card-status" style="color:var(--text-dim)">继续探索</div>
      `;
    }
    grid.appendChild(card);
  }
}

// ==================== SHARE ====================
async function copyShareLink() {
  const url = `${window.location.origin}${window.location.pathname}#${State.endingId}`;
  try {
    await navigator.clipboard.writeText(url);
    showToast('链接已复制到剪贴板');
  } catch {
    const input = document.createElement('input');
    input.value = url;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    showToast('链接已复制');
  }
}

function savePoster() {
  const canvas = $('#poster-canvas');
  const link = document.createElement('a');
  link.download = `晚休住校须知_${State.endingId}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ==================== SECURITY ====================
function lockDown() {
  // Block right-click
  document.addEventListener('contextmenu', e => e.preventDefault());
  // Block common DevTools shortcuts
  document.addEventListener('keydown', e => {
    if (e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'u') ||
        (e.ctrlKey && e.key === 's')) {
      e.preventDefault();
      return false;
    }
  });
  // Block pinch-zoom gestures
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('gestureend', e => e.preventDefault());
  // Block double-tap zoom
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
}

// ==================== BUTTON BINDINGS ====================
function bindButtons() {
  $('#btn-poster').addEventListener('click', enterPoster);
  $('#btn-share').addEventListener('click', copyShareLink);
  $('#btn-collection').addEventListener('click', enterCollection);
  $('#btn-restart').addEventListener('click', restartGame);
  $('#btn-close-poster').addEventListener('click', () => showLayer('layer-ending'));
  $('#btn-close-collection').addEventListener('click', () => showLayer('layer-ending'));
  $('#btn-save-poster').addEventListener('click', savePoster);
  $('#float-share').addEventListener('click', copyShareLink);
  // Show floating share button after intro completes
  setTimeout(() => $('#float-share').classList.add('visible'), 4000);
}

// ==================== RESTART ====================
function restartGame() {
  State.phase = 'BOOT';
  State.ruleIndex = 0;
  State.eventIndex = 0;
  State.eventQueue = [];
  State.flags = { obeyCount: 0, violateCount: 0, triggeredVisitor: false, triggered404: false, triggeredMirror: false, triggeredList: false };
  State.endingId = null;
  State.isTyping = false;
  State.skipRequested = false;
  $('#game-title').classList.remove('visible');
  $('#game-title').textContent = '';
  $('#rule-title').textContent = '';
  $('#rule-body').textContent = '';
  $('#event-text').textContent = '';
  $('#event-outcome').textContent = '';
  $('#ending-body').textContent = '';
  // Reset eye-open animation
  const eyelid = $('#intro-eyelid');
  eyelid.style.display = '';
  eyelid.style.animation = 'none';
  void eyelid.offsetWidth;
  eyelid.style.animation = '';
  showLayer('layer-intro');
  $('#float-share').classList.remove('visible');
  setTimeout(() => $('#float-share').classList.add('visible'), 4000);
  boot();
}

// ==================== BOOT ====================
async function boot() {
  // Check URL hash for shared ending
  const hash = window.location.hash.slice(1);
  if (hash && ENDINGS[hash]) {
    State.endingId = hash;
    Storage.unlock(hash);
    // Brief intro, then show the ending directly
    await enterIntro();
    await sleep(600);
    await enterEnding();
    return;
  }

  await enterIntro();
  await sleep(400);
  await enterRules();
  await sleep(300);
  await enterEvents();
  await sleep(300);
  await enterEnding();
}

// ==================== INIT ====================
function init() {
  lockDown();
  initNoise();
  setupSkip();
  bindButtons();
  boot();
}

document.addEventListener('DOMContentLoaded', init);

// Handle beforeunload if game in progress
window.addEventListener('beforeunload', (e) => {
  if (State.isTyping && State.phase !== 'BOOT') {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
</body>
